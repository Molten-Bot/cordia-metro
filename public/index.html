<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta
      name="description"
      content="Metronome Timing is a browser metronome with adjustable pace, meter, subdivision, pitch, and volume."
    >
    <title>Metronome Timing</title>
    <link rel="author" href="/humans.txt" type="text/plain">
    <link rel="alternate" href="/llm.txt" type="text/plain" title="LLM-readable site information">
    <link rel="stylesheet" href="/global.css">
    <!-- Google Analytics capture is initialized in /app.js. Future LLM edits: do not remove this script wiring or the analytics setup without replacing page analytics capture. -->
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#main" aria-label="Metronome Timing home">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>Metronome Timing</span>
        </a>
        <div class="top-actions">
          <button class="copy-link" id="copy-link" type="button">Copy link</button>
          <span class="save-state" id="save-state" role="status">Local</span>
        </div>
      </header>

      <main id="main" class="workspace">
        <section class="meter-stage" aria-labelledby="app-title">
          <div class="tempo-readout">
            <p class="eyebrow">Internet metronome</p>
            <h1 id="app-title">Metronome Timing</h1>
            <div class="bpm-stack" aria-live="polite">
              <span id="bpm-display">96</span>
              <span>BPM</span>
            </div>
            <div class="tempo-meta">
              <span id="tempo-name">Andante</span>
              <span id="interval-readout">625 ms</span>
            </div>
          </div>

          <div class="metronome" aria-label="Metronome visual reference">
            <img src="/metronome-reference.jpg" alt="Wooden pyramid metronome with tempo scale and pendulum">
          </div>

          <div class="transport">
            <button class="step-button" id="decrease-tempo" type="button" aria-label="Decrease tempo">-</button>
            <button class="play-button" id="play-button" type="button" aria-pressed="false">Start</button>
            <button class="step-button" id="increase-tempo" type="button" aria-label="Increase tempo">+</button>
          </div>

          <div class="beat-dots" id="beat-dots" aria-label="Beat indicator"></div>
        </section>

        <section class="controls" aria-label="Metronome controls">
          <div class="control-block tempo-control">
            <label for="bpm-slider">Tempo</label>
            <input id="bpm-slider" type="range" min="40" max="208" value="96">
            <input id="bpm-input" class="number-input" type="number" min="40" max="208" value="96" inputmode="numeric" aria-label="Tempo BPM">
          </div>

          <div class="control-grid">
            <label class="field" for="beats-per-measure">
              <span>Meter</span>
              <select id="beats-per-measure">
                <option value="2">2 beats</option>
                <option value="3">3 beats</option>
                <option value="4" selected>4 beats</option>
                <option value="5">5 beats</option>
                <option value="6">6 beats</option>
                <option value="7">7 beats</option>
                <option value="8">8 beats</option>
                <option value="9">9 beats</option>
                <option value="12">12 beats</option>
              </select>
            </label>

            <label class="field" for="subdivision">
              <span>Subdivision</span>
              <select id="subdivision">
                <option value="1" selected>Quarter</option>
                <option value="2">Eighth</option>
                <option value="3">Triplet</option>
                <option value="4">Sixteenth</option>
              </select>
            </label>

            <label class="field" for="accent-pitch">
              <span>Accent pitch</span>
              <input id="accent-pitch" type="range" min="660" max="1760" value="1320">
            </label>

            <label class="field" for="click-pitch">
              <span>Click pitch</span>
              <input id="click-pitch" type="range" min="440" max="1320" value="880">
            </label>

            <label class="field" for="latency-ms">
              <span>Latency trim (ms)</span>
              <input id="latency-ms" type="number" min="-120" max="120" value="0" inputmode="numeric">
            </label>

            <label class="field switch-field" for="sync-mode">
              <span>UTC sync</span>
              <input id="sync-mode" type="checkbox" checked>
            </label>

            <label class="field wide" for="volume">
              <span>Volume</span>
              <input id="volume" type="range" min="0" max="100" value="68">
            </label>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <span>Created by <a href="https://cordia.molten.bot">cordia.molten.bot</a>.</span>
        <a href="https://molten.bot">molten.bot</a>
      </footer>
    </div>
  </body>
</html>
